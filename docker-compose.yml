services:

  vault-init:
    image: docker:cli
    container_name: vault_init
    volumes:
      - ./vault.sh:/vault.sh
      - ./backend:/home/aau/Desktop/project2/Expense_Tracker/backend
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache jq bash && /bin/bash /vault.sh"]

  db:
    image: postgres:16
    container_name: expense_db
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      vault-init:
        condition: service_completed_successfully
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: expense_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      vault-init:
        condition: service_completed_successfully
      db:
        condition: service_started
    ports:
      - "8000:8000"

volumes:
  db_data:
